<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5과 문법 학습</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: #333;
            text-align: center;
        }
        /* 세로 배치 컨테이너 */
        .button-container {
            display: flex;
            flex-direction: column; /* 세로 정렬 */
            gap: 20px; /* 버튼 사이 간격 */
            width: 100%;
            max-width: 500px; /* 버튼 최대 너비 */
        }
        /* 시원시원하고 큰 버튼 스타일 */
        .btn {
            display: block;
            width: 100%;
            padding: 25px 20px;
            background-color: #4A90E2;
            color: #ffffff;
            font-size: 1.8rem; /* 크게 적힌 글자 */
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 16px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
            border: none;
            cursor: pointer;
        }
        /* 마우스 호버 및 터치 효과 */
        .btn:hover, .btn:active {
            background-color: #357ABD;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <h1>5과 문법 학습 링크</h1>

    <div class="button-container">
        <!-- href 부분에 연결할 링크 주소를 넣으세요 -->
        <a href="#" class="btn">5과 문법 1번째!</a>
        <a href="#" class="btn">2번째</a>
        <a href="#" class="btn">3번째</a>
        <a href="#" class="btn">4번째</a>
    </div>

</body>
</html>
